name: CI

# PR + main 푸시마다 빌드+테스트 자동 실행 (초록불/빨간불 문지기)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          # 로컬 개발 환경과 정확히 일치 (Node 24 + pnpm 11.2.2).
          # pnpm 9 는 workspace overrides 거부, pnpm 11.5 는 Node 20 builtin 미지원 → 둘 다 고정.
          version: 11.2.2

      - name: Node 24 + pnpm 캐시
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # raw JSON.parse(readFileSync) 재도입 차단 — BOM/손상 JSON throw 원천 봉쇄(readJsonFile 강제).
      - name: raw JSON.parse 금지 게이트
        run: node scripts/check-no-raw-json-parse.mjs

      # 타입체크 — 빌드(tsup)가 놓치는 타입오류를 엄격 검사(tsc --noEmit). 결정적·블로킹.
      - name: 타입체크 (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # Goal 게이트 전수 — 완료된 goal 0~20 의 완료조건이 이후 수정으로 몰래 깨지는지 회귀 가드.
      # 새 check-goal-*.mjs 자동 포함(sort -V). meta/no-stray 공통 게이트도 함께.
      - name: Goal 게이트 전수 (완료 goal 회귀 가드)
        run: |
          node scripts/check-meta.mjs
          node scripts/check-no-stray.mjs
          for f in $(ls scripts/check-goal-*.mjs | sort -V); do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

      # build 가 test 보다 먼저: cli-args e2e 테스트가 dist/index.js 를 spawn 한다.
      - name: 빌드
        run: pnpm build

      # 의존성 취약점 감사 — 정보성(continue-on-error). 차단형 보안 업뎃은 Dependabot 담당.
      # 새 취약점이 무관 작업 머지를 막지 않도록 비블로킹. 로그/Summary 로만 노출.
      - name: 의존성 취약점 감사 (정보성)
        continue-on-error: true
        run: node dist/index.js audit

      # 네트워크 의존 없음 — cloud gist 실호출은 유닛테스트 대상 아님(순수 로직만 테스트).
      - name: 테스트
        run: pnpm test:run

  # 자가 도그푸딩 — 방금 빌드한 vhk CLI 를 vhk 레포 자신에게 실행한다.
  # 목적: SnapContext류 결함(서브커맨드 라우팅 누수·크래시)을 매 push 자동 포착.
  #       유닛테스트(test 잡)가 못 잡는 "실제 실행" 결함을 막는 안전망.
  # 범위: 비대화형·읽기/조회 명령만. apply/undo/suggest 등 TTY·쓰기 명령 제외
  #       — 안전 1원칙 "자동 학습 OK · 자동 적용 금지". RULES.md 미사용 레포라 evolve suggest 제외.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Node 24 + pnpm 캐시
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 도그푸딩 대상 = 방금 빌드한 dist/index.js (bin: vhk). 배포될 실코드를 그대로 시식.
      - name: 빌드
        run: pnpm build

      # 보안 게이트 — public npm 패키지라 시크릿/키 유출 = 사고. vhk 자체 스캐너로 매 push 검사.
      # 유출 탐지 시 비0 종료 → 빌드 실패(머지 차단).
      - name: 보안 스캔 (시크릿·키 유출 가드)
        run: node dist/index.js secure scan

      # 각 명령 비0 종료 시 스텝 실패(GHA bash -eo pipefail). 어떤 명령이 깨졌는지 group 로그로 표시.
      - name: vhk 가 vhk 를 검사 (CLI 자가 동작 — 비대화형·읽기전용)
        run: |
          echo "::group::doctor — 개발 환경 점검"
          node dist/index.js doctor
          echo "::endgroup::"
          echo "::group::status — 프로젝트 상태 대시보드"
          node dist/index.js status
          echo "::endgroup::"
          echo "::group::memory list — 기억 v2 조회"
          node dist/index.js memory list
          echo "::endgroup::"
          echo "::group::pattern list — 패턴 목록 (서브커맨드 라우팅 누수 회귀 가드)"
          node dist/index.js pattern list --all
          echo "::endgroup::"
          echo "::group::pattern detect — Evolution Loop 패턴 감지 (읽기측·멱등)"
          node dist/index.js pattern detect --json
          echo "::endgroup::"
          echo "::group::evolve list — 진화 후보 조회"
          node dist/index.js evolve list
          echo "::endgroup::"
