name: CI

# PR + main 푸시마다 빌드+테스트 자동 실행 (초록불/빨간불 문지기)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Goal 47: 주 사용·배포 환경(win32)과 툴체인 하한 Node 를 매트릭스로 실검증.
    #   ubuntu/windows × node 22/24 = 4조합. fail-fast:false 로 한 조합 실패가 나머지를 안 끊음.
    #   하한이 22 인 이유: packageManager pnpm@11.17.0 이 node:sqlite 의존으로 Node >=22.13 요구
    #   (Node 20 에선 pnpm 자체가 ERR_UNKNOWN_BUILTIN_MODULE 로 실패 — goal 47 이 실측). 런타임
    #   engines(>=20)는 별개 — vhk 실행은 node 20 호환이나 CI 툴체인(pnpm) 하한은 22.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # pnpm 버전은 package.json "packageManager"(pnpm@11.17.0) 단일 소스에서 읽음.
      # (pnpm 9 는 workspace overrides 거부 → 11.x 고정. Dependabot/corepack 도 동일 버전 사용.)
      - name: pnpm 설치
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Node ${{ matrix.node }} + pnpm 캐시
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # raw JSON.parse(readFileSync) 재도입 차단 — BOM/손상 JSON throw 원천 봉쇄(readJsonFile 강제).
      - name: raw JSON.parse 금지 게이트
        run: node scripts/check-no-raw-json-parse.mjs

      # 타입체크 — 빌드(tsup)가 놓치는 타입오류를 엄격 검사(tsc --noEmit). 결정적·블로킹.
      - name: 타입체크 (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # 린트 — type-aware async 안전성(잊은 await·Promise 오용)만 검사. 결정적·블로킹.
      - name: 린트 (eslint — async 안전성)
        run: pnpm lint

      # 좀도둑 파일 가드 — 정적 검사(빌드/테스트 불필요).
      - name: 좀도둑 파일 가드
        run: node scripts/check-no-stray.mjs

      # Goal 121: 작업 단위의 회귀 검사는 추적되는 tests/에 두고 이 잡에서 매 PR 실행한다.
      # 비추적 goal 카드의 로컬 게이트를 전수 재실행하면 같은 test/build가 N회 중복되므로 CI SoT로 쓰지 않는다.

      # build 가 test 보다 먼저: cli-args e2e 테스트가 dist/index.js 를 spawn 한다.
      - name: 빌드
        run: pnpm build

      - name: 규칙 파일 전파 확인
        run: node dist/index.js sync --check

      - name: 연결된 규칙 검사
        run: node dist/index.js check

      - name: npm 공개 경계 검사
        run: pnpm boundary:check

      - name: High 이상 의존성 취약점 차단
        run: pnpm security:audit

      # 의존성 취약점 감사 — 정보성(continue-on-error). 차단형 보안 업뎃은 Dependabot 담당.
      # 새 취약점이 무관 작업 머지를 막지 않도록 비블로킹. 로그/Summary 로만 노출.
      - name: 의존성 취약점 감사 (정보성)
        continue-on-error: true
        run: node dist/index.js audit

      # 네트워크 의존 없음 — cloud gist 실호출은 유닛테스트 대상 아님(순수 로직만 테스트).
      - name: 테스트
        run: pnpm test:run

  # 자가 도그푸딩 — 방금 빌드한 vhk CLI 를 vhk 레포 자신에게 실행한다.
  # 목적: SnapContext류 결함(서브커맨드 라우팅 누수·크래시)을 매 push 자동 포착.
  #       유닛테스트(test 잡)가 못 잡는 "실제 실행" 결함을 막는 안전망.
  # 범위: 비대화형·읽기/조회 명령만. apply/undo/suggest 등 TTY·쓰기 명령 제외
  #       — 안전 1원칙 "자동 학습 OK · 자동 적용 금지". RULES.md 미사용 레포라 evolve suggest 제외.
  # Goal 47: win32 서브커맨드 라우팅·경로·.cmd shim 실검증 위해 windows-latest 도 포함.
  dogfood:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # pnpm 버전은 package.json "packageManager" 단일 소스에서 읽음.
      - name: pnpm 설치
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Node 24 + pnpm 캐시
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 도그푸딩 대상 = 방금 빌드한 dist/index.js (bin: vhk). 배포될 실코드를 그대로 시식.
      - name: 빌드
        run: pnpm build

      - name: npm 공개 경계 검사
        run: pnpm boundary:check

      # 보안 게이트 — public npm 패키지라 시크릿/키 유출 = 사고. vhk 자체 스캐너로 매 push 검사.
      # 유출 탐지 시 비0 종료 → 빌드 실패(머지 차단).
      - name: 보안 스캔 (시크릿·키 유출 가드)
        run: node dist/index.js secure scan

      # 각 명령 비0 종료 시 스텝 실패. shell:bash 로 win32 에서도 동일 스크립트(::group::) 동작.
      - name: vhk 가 vhk 를 검사 (CLI 자가 동작 — 비대화형·읽기전용)
        shell: bash
        run: |
          echo "::group::doctor — 개발 환경 점검"
          node dist/index.js doctor
          echo "::endgroup::"
          echo "::group::status — 프로젝트 상태 대시보드"
          node dist/index.js status
          echo "::endgroup::"
          echo "::group::memory list — 기억 v2 조회"
          node dist/index.js memory list
          echo "::endgroup::"
          echo "::group::pattern list — 패턴 목록 (서브커맨드 라우팅 누수 회귀 가드)"
          node dist/index.js pattern list --all
          echo "::endgroup::"
          echo "::group::pattern detect — Evolution Loop 패턴 감지 (읽기측·멱등)"
          node dist/index.js pattern detect --json
          echo "::endgroup::"
          echo "::group::evolve list — 진화 후보 조회"
          node dist/index.js evolve list
          echo "::endgroup::"

      # 규칙 드리프트 관찰 — 비차단(continue-on-error). 안정되면 차단형으로 승격.
      - name: doctor --strict (규칙 드리프트 관찰 — 비차단)
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::doctor --strict — 규칙 드리프트 관찰"
          node dist/index.js doctor --strict
          echo "::endgroup::"

  # Goal 47: 매트릭스화로 잡 컨텍스트가 'test (os, node)'·'dogfood (os)'로 바뀌어 브랜치 보호의
  #   고정 필수체크 이름이 깨진다. 집계 잡 'gate' 하나를 두고 보호 규칙은 이것만 require —
  #   매트릭스 조합이 바뀌어도 필수체크 이름(gate)은 불변(미래안전).
  # #526 — 원격 에이전트·CI 기록 집행 사각지대.
  # 로컬 훅이 요구하는 세션 기록은 docs/devlog/ 와 .vhk/events/ 로 전부 비추적이라 클론만 받는
  # CI 는 존재를 볼 수 없다(훅을 CI 로 옮겨도 같다). 그래서 추적되는 공개 기록물로 축을 바꿨다.
  record:
    name: 기록 동반 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # PR 코드를 실행하는 잡이라 체크아웃 토큰을 남기지 않는다.
          persist-credentials: false

      # 검사받는 쪽이 검사기를 고를 수 있으면 게이트가 아니다.
      # PR 이 이 스크립트를 항상 통과하도록 바꿔 우회하는 걸 막으려고 base 판본을 꺼내 쓴다.
      - name: 게이트 구현을 base 에서 추출
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:scripts/check-pr-record.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-pr-record.mjs" > "$RUNNER_TEMP/gate.mjs"
          else
            echo "::notice::base 에 게이트가 없습니다 — 도입 PR 로 보고 이 PR 판본을 씁니다"
            cp scripts/check-pr-record.mjs "$RUNNER_TEMP/gate.mjs"
          fi

      - name: 코드 변경에 기록물이 동반됐는지
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "$RUNNER_TEMP/gate.mjs" "$BASE_SHA" "$HEAD_SHA"

  gate:
    name: gate
    needs: [test, dogfood, record]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 매트릭스 전조합 성공 확인
        run: |
          echo "test=${{ needs.test.result }} · dogfood=${{ needs.dogfood.result }} · record=${{ needs.record.result }}"
          # record 는 PR 에서만 도므로 main 푸시에서는 skipped 가 정상이다.
          if [ "${{ needs.record.result }}" != "success" ] && [ "${{ needs.record.result }}" != "skipped" ]; then
            echo "::error::기록 동반 확인 실패 — gate fail (머지 차단)"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.dogfood.result }}" != "success" ]; then
            echo "::error::매트릭스 일부 조합 실패 — gate fail (머지 차단)"
            exit 1
          fi
          echo "✅ 매트릭스 전조합 성공"
